<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <title>Offers</title>

    <!--Styles-->
    <style>
      * {
        box-sizing: border-box;
        margin: 0px;
        padding: 0px;
        font-family: "Poppins", sans-serif;
      }

      body {
        display: flex;
        flex-direction: column;
        position: relative;
        min-height: 100vh;
        background-color: #f8fafc;
      }

      section {
        margin-bottom: 50px;
        height: 100px;
        background-color: #e90000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      h1 {
        font-size: 40px;
        color: white;
      }

      main {
        padding: 20px;
        max-width: 1200px;
        margin: 0 auto;
        width: 100%;
      }

      .offers-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 25px;
        margin-top: 30px;
      }

      .offer-card {
        background-color: white;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s ease;
      }

      .offer-card:hover {
        transform: translateY(-5px);
      }

      .offer-header {
        background-color: #065f46;
        color: white;
        padding: 20px;
        text-align: center;
      }

      .offer-name {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 5px;
      }

      .offer-price {
        font-size: 2rem;
        font-weight: 700;
      }

      .offer-duration {
        font-size: 0.9rem;
        opacity: 0.9;
      }

      .offer-body {
        padding: 20px;
      }

      .offer-features {
        list-style-type: none;
        margin-bottom: 20px;
      }

      .offer-features li {
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .offer-features li i {
        color: #065f46;
      }

      .offer-actions {
        display: flex;
        justify-content: center;
        position: relative;
      }

      .btn {
        padding: 12px 24px;
        border-radius: 5px;
        border: none;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s ease;
        width: 100%;
        text-align: center;
      }

      .btn-primary {
        background-color: #e90000;
        color: white;
      }

      .btn-primary:hover {
        background-color: #064e3b;
      }

      .special-offer {
        position: relative;
        overflow: hidden;
      }

      .special-offer::before {
        content: "SPECIAL";
        position: absolute;
        top: 10px;
        right: -30px;
        background-color: #ffc107;
        color: white;
        padding: 3px 30px;
        transform: rotate(45deg);
        font-size: 0.8rem;
        font-weight: 600;
      }

      .offer-savings {
        color: #065f46;
        font-weight: 600;
        text-align: center;
        margin-top: 10px;
        font-size: 0.9rem;
      }

      .section-title {
        text-align: center;
        color: #e90000;
        margin-bottom: 10px;
        font-size: 1.5rem;
      }

      .section-subtitle {
        text-align: center;
        color: #64748b;
        margin-bottom: 30px;
        font-size: 1rem;
      }

      /* Message styles */
      .message {
        padding: 15px;
        border-radius: 5px;
        margin-top: 15px;
        text-align: center;
        display: none;
      }

      .error-message {
        background-color: #fee2e2;
        color: #b91c1c;
        border: 1px solid #fca5a5;
      }

      .success-message {
        background-color: #dcfce7;
        color: #166534;
        border: 1px solid #86efac;
      }

      /* Mobile responsiveness */
      @media (max-width: 768px) {
        h1 {
          font-size: 32px;
        }

        .section-title {
          font-size: 1.3rem;
        }

        .section-subtitle {
          font-size: 0.9rem;
        }

        .offers-container {
          grid-template-columns: 1fr;
          gap: 20px;
        }

        .offer-card {
          margin-bottom: 15px;
        }

        /* Position messages at bottom of form on mobile */
        .offer-actions {
          flex-direction: column;
        }

        .message {
          order: 1;
          margin-top: 15px;
          display: block;
        }

        .btn {
          order: 0;
        }
      }

      @media (max-width: 480px) {
        h1 {
          font-size: 28px;
        }

        section {
          height: 80px;
          margin-bottom: 30px;
        }

        main {
          padding: 15px;
        }

        .offer-header {
          padding: 15px;
        }

        .offer-name {
          font-size: 1.3rem;
        }

        .offer-price {
          font-size: 1.8rem;
        }

        .offer-body {
          padding: 15px;
        }

        .special-offer::before {
          font-size: 0.7rem;
          right: -35px;
        }
      }
    </style>
  </head>
  <body>
    <!--Header section-->
    <section>
      <h1>Offers</h1>
    </section>

    <!--Main section-->
    <main>
      <h2 class="section-title">Choose Your Plan</h2>
      <p class="section-subtitle">
        Select the perfect WiFi access plan for your needs
      </p>

      <div class="offers-container" id="offers-container">
        <!-- Offers will be dynamically inserted here -->
      </div>
    </main>

    <!--Script-->
    <script>
      let allPlans = [];

      const fetchOffers = async () => {
        try {
          const response = await fetch(
            "http://localhost:3000/api/v1/plans/get-plans",
            {
              method: "GET",
              headers: {
                "Content-Type": "application/json",
              },
            }
          );

          if (!response.ok) {
            throw new Error('Failed to fetch offers');
          }

          const plans = await response.json();
          allPlans = plans; // Store plans globally
          renderOffers(plans);
        } catch (error) {
          console.error("Error fetching offers:", error);
          showError('Failed to load offers. Please try again later.');
        }
      };

      const renderOffers = (plans) => {
        const container = document.getElementById('offers-container');
        
        if (!plans || plans.length === 0) {
          showError('No offers available at the moment.');
          return;
        }

        container.innerHTML = plans.map((plan, index) => `
          <div class="offer-card ${plan.is_popular ? 'special-offer' : ''}">
            <div class="offer-header">
              <div class="offer-name">${plan.name}</div>
              <div class="offer-price">KES ${parseFloat(plan.cost).toFixed(2)}</div>
              <div class="offer-duration">${plan.duration}</div>
            </div>
            <div class="offer-body">
              <ul class="offer-features">
                ${(plan.features || []).map(feature => `
                  <li><i class="fas fa-check"></i> ${feature}</li>
                `).join('')}
              </ul>
              <div class="offer-actions">
                <button class="btn btn-primary" data-plan-id="${plan.plan_id}">Get Started</button>
                <div class="message error-message" id="error-${plan.plan_id}" style="display: none;"></div>
                <div class="message success-message" id="success-${plan.plan_id}" style="display: none;"></div>
              </div>
              ${plan.is_popular ? '<div class="offer-savings">Popular Choice</div>' : ''}
            </div>
          </div>
        `).join('');

        // Add event listeners to all buttons
        document.querySelectorAll('.btn-primary').forEach(button => {
          button.addEventListener('click', handlePurchase);
        });
      };

      const showError = (message, planId = null) => {
        if (planId) {
          // Show error for specific plan
          const errorElement = document.getElementById(`error-${planId}`);
          errorElement.textContent = message;
          errorElement.style.display = 'block';
          document.getElementById(`success-${planId}`).style.display = 'none';
        } else {
          // Global error
          const container = document.getElementById('offers-container');
          container.innerHTML = `
            <div style="grid-column: 1/-1; text-align: center; padding: 20px;">
              <p class="error-message" style="display: block;">${message}</p>
            </div>
          `;
        }
      };

      const showSuccess = (message, planId) => {
        const successElement = document.getElementById(`success-${planId}`);
        successElement.textContent = message;
        successElement.style.display = 'block';
        document.getElementById(`error-${planId}`).style.display = 'none';
      };

      const handlePurchase = async (event) => {
        const planId = event.target.getAttribute('data-plan-id');
        const plan = allPlans.find(p => p.plan_id == planId);
        
        if (!plan) {
          showError('Plan not found', planId);
          return;
        }

        try {
          const response = await fetch(
            "http://localhost:3000/api/v1/plans/purchase-plan",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                plan_id: planId
              })
            }
          );

          if (!response.ok) {
            const error = await response.json();
            throw new Error(error.message || 'Purchase failed');
          }

          const result = await response.json();
          showSuccess(`Successfully purchased: ${plan.name}`, planId);
          
        } catch (error) {
          console.error("Purchase error:", error);
          showError(`Error: ${error.message}`, planId);
        }
      };

      window.addEventListener("load", fetchOffers);
    </script>
  </body>
</html>
