<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!--Styles-->
    <style>

    </style>
</head>
<body>
    <!--Header section-->
    <section>
        <h1>Login</h1>
    </section>

    <!--Main section-->
    <main>
        <form id="formEl">
            <input id=""phoneEl type="tel" placeholder="Phone number" />
            <input id="passwordEl" type="password" placeholder="Password" />
            <input type="submit" value="Login" />
            <p>
                Don't have an account?
                <span>
                    <a href="/register.html">Register</a>
                </span>
            </p>
        </form>
    </main>

    <!--Script-->
    <script>
        const phone = document.getElementById("phoneEl")
        const password = document.getElementById("passwordEl")

        document.getElementById("formEl").addEventListener('submit', async (event)=>{
            event.preventDefault()

            const data = {
                phone: phone.value,
                password: password.value
            }

            const response = await fetch('http://localhost:3000/api/v1/auth/login', {
                headers:{
                    'Content-Type':'application/json'
                },
                body: JSON.stringify(data)
            })

            if(response.ok){
                // Redirect to offers page
                window.location.href = 'offers.html'
            }
        })
    </script>
</body>
</html>
